<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="logo.svg">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="utility.css">
    <title>My Music </title>
</head>

<body>
    <div class="container flex justify-center">
        <div class="left m-1 rounded ">
            <div class="home m-1 p-1 rounded bg-grey">
                <div class="logo flex space-between items-center">
                    <img class="invert m-1" src="spotifyicon.svg" alt="Spotify">
                    <img class="invert close" src="close.svg" alt="">
                </div>
                <ul>
                    <li class="flex items-center"> <img class="invert" src="svg/home.svg" alt="">Home</li>
                    <li class="flex items-center"> <img class="invert" src="svg/search.svg" alt="">Search</li>

                </ul>
            </div>
            <div class="library m-1 p-1 rounded bg-grey ">
                <div class="heading flex p-2 items-center">
                    <img class="invert" src="svg/playlist.svg" alt="Library">
                    <h3>Your Library</h3>
                </div>
                <div class="songlist">
                    <ul>
                    </ul>
                </div>
                <div class="footer">
                    <div>
                        <a href="https://www.spotify.com/in-en/legal/">
                            <span>Legal</span>
                        </a>

                    </div>
                    <div>
                        <a href="https://www.spotify.com/in-en/safetyandprivacy/">
                            <span>Safety &amp; Privacy Center</span>
                        </a>
                    </div>
                    <div>
                        <a href="https://www.spotify.com/in-en/legal/privacy-policy/">
                            <span>Privacy Policy</span>
                        </a>
                    </div>
                    <div>
                        <a href="https://www.spotify.com/in-en/legal/cookies-policy/">
                            <span>Cookies</span>
                        </a>
                    </div>
                    <div>
                        <a href="https://www.spotify.com/in-en/legal/privacy-policy/#s3">
                            <span>About Ads</span>
                        </a>
                    </div>
                    <div>
                        <a href="https://www.spotify.com/in-en/accessibility/">
                            <span>Accessibility</span>
                        </a>
                    </div>
                    <div>
                        <a href="https: //www.spotify.com/legal/cookies-policy/">
                            <span>Cookies</span>
                        </a>
                    </div>
                </div>
            </div>
        </div>
        <div class="right rounded bg-grey">
            <div class="header items-center rounded">
                <div class="nav flex space-between items-center">
                    <img class="invert hamburger" src="svg/hamburger.svg" alt="">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" color="#ffffff"
                        fill="none">
                        <path d="M15 6C15 6 9.00001 10.4189 9 12C8.99999 13.5812 15 18 15 18" stroke="currentColor"
                            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" color="#ffffff"
                        fill="none">
                        <path d="M9.00005 6C9.00005 6 15 10.4189 15 12C15 13.5812 9 18 9 18" stroke="currentColor"
                            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                    </svg>

                </div>
                <div class="buttons">
                    <button class="signupbtn">Sign up</button>
                    <button class="loginbtn">Log in</button>
                </div>
            </div>

            <div class="Spotify_playlists ">
                <h1>Spotify Playlists</h1>
                <div class="cardContainer"></div>
            </div>
            <div class="playbar flex justify-center items-center ">
                <div class="seekbar">
                    <div class="circle">

                    </div>
                </div>
                <div class="abovebar">
                    <div class="songinfo"></div>
                    <div class="songButtons flex justify-center">
                        <img class="invert m-2" id="previous" src="svg/prev.svg" alt="Prevoius Song">
                        <img class="invert m-2" id="play" src="svg/play.svg" alt="Play or Pause song">
                        <img class="invert m-2" id="next" src="svg/next.svg" alt="Next Song">
                    </div>
                    <div class="playright flex space-between">
                             <div class="songtime"></div>
                           <div class="volume flex space-between">
                             <img class="invert" src="svg/volume.svg" alt="">
                            <div class="range">
                                <input type="range" name="volume">
                            </div>
                           </div>
                        
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
